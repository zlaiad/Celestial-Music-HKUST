<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日晷时间选择器 - 中国时间</title>
    <link rel="preload" href="/static/fonts/wqy-microhei.ttc" as="font" type="font/ttc" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Microsoft Yahei", sans-serif;
            background: radial-gradient(circle at top left, rgba(102, 126, 234, 0.3), transparent 55%),
                radial-gradient(circle at bottom right, rgba(118, 75, 162, 0.35), transparent 45%),
                linear-gradient(135deg, #070815 0%, #12122b 45%, #1c1a3f 100%);
            overflow-x: hidden;
            color: #fff;
        }

        .stars {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle 2.4s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.15;
            }

            50% {
                opacity: 0.9;
            }
        }

        .page-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: clamp(2rem, 4vw, 4rem) clamp(1.5rem, 4vw, 3rem) clamp(3rem, 6vw, 5rem);
        }

        .page-header {
            text-align: center;
            margin-bottom: clamp(1.5rem, 5vw, 3rem);
            max-width: 640px;
        }

        .page-title {
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .page-subtitle {
            margin-top: 1rem;
            font-size: clamp(1.1rem, 2.8vw, 1.35rem);
            color: rgba(222, 230, 255, 0.78);
            line-height: 1.7;
        }

        .content-section {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .layout-grid {
            width: min(100%, 1080px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: clamp(1.4rem, 4vw, 2.6rem);
            align-items: center;
            justify-content: center;
        }

        .sundial-panel {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sundial-frame {
            width: min(96vw, 640px);
            aspect-ratio: 1 / 1;
            position: relative;
        }

        #sundialCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            cursor: grab;
            transition: transform 0.3s ease;
            box-shadow: 0 24px 60px rgba(15, 20, 45, 0.55);
        }

        #sundialCanvas:active {
            cursor: grabbing;
        }

        .info-panel {
            background: transparent;
            border-radius: 24px;
            border: none;
            padding: 0;
            box-shadow: none;
            width: min(100%, 520px);
            margin: 0 auto;
            justify-self: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(1rem, 2.5vw, 1.4rem);
        }

        .info-heading {
            font-size: clamp(1.45rem, 3vw, 1.85rem);
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
        }

        .info-lead {
            color: rgba(216, 224, 255, 0.75);
            line-height: 1.7;
            margin-bottom: clamp(1.4rem, 3vw, 2rem);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(1rem, 2.5vw, 1.4rem);
            width: min(100%, 460px);
        }

        .info-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.16);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0.45rem;
            width: 100%;
        }

        .info-card i {
            font-size: 1.4rem;
            color: #a6b7ff;
        }

        .info-card p {
            margin: 0;
        }

        .info-label {
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(215, 221, 255, 0.7);
        }

        .info-value {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .confirm-btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 14px;
            color: white;
            padding: 0.95rem 1.2rem;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 16px 38px rgba(102, 126, 234, 0.35);
        }

        .action-area {
            width: min(100%, 520px);
            margin: 0 auto;
        }

        .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.5);
        }

        .confirm-btn i {
            font-size: 0.95rem;
        }

        .mobile-helper {
            margin-top: 1rem;
            font-size: 0.95rem;
            color: rgba(222, 229, 255, 0.65);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .mobile-helper i {
            color: rgba(102, 126, 234, 0.9);
        }

        @media (max-width: 1024px) {
            .layout-grid {
                width: min(100%, 720px);
            }

            .info-panel {
                width: min(100%, 520px);
                margin-inline: auto;
                justify-self: center;
            }

            .sundial-panel {
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .info-card {
                border-radius: 16px;
            }

            .step-line {
                flex-basis: 40px;
            }

            .info-card {
                align-items: center;
                text-align: center;
            }
        }

        @media (max-width: 540px) {
            .page-container {
                padding: 2.4rem 1.1rem 3rem;
            }

            .layout-grid {
                width: min(100%, 520px);
            }

            .info-panel {
                width: min(100%, 500px);
                margin-inline: auto;
                justify-self: center;
            }

            .step-indicator {
                gap: 0.65rem;
            }

            .step-line {
                display: none;
            }

            .mobile-helper {
                font-size: 0.9rem;
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="stars" id="stars"></div>

    <main class="page-container">
        <header class="page-header">
            <h1 class="page-title">中国时间</h1>
            <p class="page-subtitle">旋转日晷，选择你的观测日期与时间</p>
        </header>

        <section class="content-section">
            <div class="layout-grid">
                <aside class="info-panel">
                    <div class="info-grid">
                        <div class="info-card">
                            <p class="info-value" id="selectedDate">1950年1月1日</p>
                        </div>
                        <div class="info-card">
                            <p class="info-value" id="selectedTime">00:00</p>
                        </div>
                    </div>
                </aside>

                <div class="sundial-panel">
                    <div class="sundial-frame">
                        <canvas id="sundialCanvas" width="600" height="600"></canvas>
                    </div>
                </div>

                <div class="action-area">
                    <button class="confirm-btn" onclick="confirmSelection()">
                        <span>确认时间，进入下一步</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const canvas = document.getElementById('sundialCanvas');
        const ctx = canvas.getContext('2d');

        const baseRingDimensions = {
            year: { radius: 240, width: 32 },
            month: { radius: 190, width: 28 },
            day: { radius: 140, width: 24 },
            hour: { radius: 95, width: 18 }
        };

        const DEFAULT_LOCATION = {
            latitude: 22.3964,
            longitude: 114.1095,
            address: '香港',
            country: '中国'
        };

        const rings = {
            year: { ...baseRingDimensions.year, min: 1950, max: 2037, current: 1950, angle: 0 },
            month: { ...baseRingDimensions.month, min: 1, max: 12, current: 1, angle: 0 },
            day: { ...baseRingDimensions.day, min: 1, max: 31, current: 1, angle: 0 },
            hour: { ...baseRingDimensions.hour, min: 0, max: 23, current: 0, angle: 0 }
        };

        let centerX = canvas.width / 2;
        let centerY = canvas.height / 2;
        let renderScale = 1;

        let isDragging = false;
        let dragRing = null;
        let lastAngle = 0;

        function init() {
            createStars();
            setCurrentTime();
            setupEventListeners();
            resizeCanvas();
            updateDisplay();
        }

        function createStars() {
            const starsContainer = document.getElementById('stars');
            const totalStars = window.innerWidth < 640 ? 120 : 180;

            for (let i = 0; i < totalStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                const size = Math.random() * 2.4 + 0.6;
                star.style.width = star.style.height = size + 'px';
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        function setCurrentTime() {
            const now = new Date();
            rings.year.current = Math.min(Math.max(now.getFullYear(), 1950), 2037);
            rings.month.current = now.getMonth() + 1;
            rings.day.current = now.getDate();
            rings.hour.current = now.getHours();

            rings.year.angle = ((rings.year.current - rings.year.min) / (rings.year.max - rings.year.min)) * 360;
            rings.month.angle = ((rings.month.current - 1) / 11) * 360;
            rings.day.angle = ((rings.day.current - 1) / (getDaysInMonth() - 1 || 1)) * 360;
            rings.hour.angle = (rings.hour.current / 23) * 360;
        }

        function getDaysInMonth() {
            return new Date(rings.year.current, rings.month.current, 0).getDate();
        }

        function resizeCanvas() {
            const wrapper = document.querySelector('.sundial-frame');
            if (!wrapper) return;

            const availableWidth = wrapper.clientWidth || Math.min(window.innerWidth * 0.96, 640);
            const availableHeight = window.innerHeight * 0.72;
            const finalSize = Math.max(Math.min(availableWidth, availableHeight, 640), 340);
            const dpr = window.devicePixelRatio || 1;

            canvas.style.width = finalSize + 'px';
            canvas.style.height = finalSize + 'px';
            canvas.width = finalSize * dpr;
            canvas.height = finalSize * dpr;

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            centerX = finalSize / 2;
            centerY = finalSize / 2;
            renderScale = finalSize / 600;

            for (const [type, ring] of Object.entries(rings)) {
                const base = baseRingDimensions[type];
                ring.radius = base.radius * renderScale;
                ring.width = Math.max(base.width * renderScale, 6);
            }

            drawSundial();
        }

        function drawSundial() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawRing('year', '年份', '#f6ad55');
            drawRing('month', '月份', '#fbd38d');
            drawRing('day', '日期', '#f6e05e');
            drawRing('hour', '小时', '#faf089');

            drawPointer();
        }

        function drawRing(type, label, color) {
            const ring = rings[type];
            const { radius, width } = ring;

            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = darkenColor(color, 0.35);
            ctx.lineWidth = Math.max(width - 4 * renderScale, 2 * renderScale);
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();

            drawTicks(type, radius, color);
            drawCurrentMarker(radius, ring.angle, color);
            drawValues(type, radius, label);
        }

        function drawTicks(type, radius, color) {
            const ring = rings[type];
            const total = ring.max - ring.min + 1;
            const tickCount = Math.min(total, 60);
            const innerOffset = 15 * renderScale;
            const outerOffset = 5 * renderScale;

            ctx.strokeStyle = color;
            ctx.lineWidth = Math.max(1.6 * renderScale, 1);

            for (let i = 0; i < tickCount; i++) {
                const angle = (i / tickCount) * 360 - 90;
                const radian = (angle * Math.PI) / 180;
                const x1 = centerX + Math.cos(radian) * (radius - innerOffset);
                const y1 = centerY + Math.sin(radian) * (radius - innerOffset);
                const x2 = centerX + Math.cos(radian) * (radius + outerOffset);
                const y2 = centerY + Math.sin(radian) * (radius + outerOffset);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
        }

        function drawCurrentMarker(radius, angle, color) {
            const radian = ((angle - 90) * Math.PI) / 180;
            const x = centerX + Math.cos(radian) * radius;
            const y = centerY + Math.sin(radian) * radius;

            const outerSize = Math.max(7 * renderScale, 5.5);
            const innerSize = Math.max(3.5 * renderScale, 2.5);

            ctx.shadowColor = color;
            ctx.shadowBlur = 18 * renderScale;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, outerSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x, y, innerSize, 0, Math.PI * 2);
            ctx.fill();
        }

function drawValues(type, radius) {
    const ring = rings[type];
    const totalRange = ring.max - ring.min;
    let tickCount = Math.min(totalRange + 1, 12); // 最多 12 个文字
    const textOffset = 26 * renderScale;

    ctx.fillStyle = '#f9fafb';
    ctx.font = `${Math.max(11 * renderScale, 9)}px "Inter", "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (tickCount <= 1) {
        ctx.fillText(ring.current.toString(), centerX, centerY - (radius + textOffset));
        return;
    }

    // 月 / 日 / 小时是“首尾相接”的，少画一个刻度避免首尾重叠
    const isCircularScale = type === 'month' || type === 'day' || type === 'hour';
    if (isCircularScale && tickCount > 2) {
        tickCount -= 1;
    }

    for (let i = 0; i < tickCount; i++) {
        // 注意这里用 tickCount 作为分母，不是 tickCount - 1
        const ratio = i / tickCount;
        const value = Math.round(ring.min + ratio * totalRange);
        const angle = ratio * 360 - 90;
        const radian = (angle * Math.PI) / 180;
        const x = centerX + Math.cos(radian) * (radius + textOffset);
        const y = centerY + Math.sin(radian) * (radius + textOffset);

        ctx.fillText(value.toString(), x, y);
    }
}


        function drawPointer() {
            const pointerHeight = 52 * renderScale;
            const pointerWidth = 6 * renderScale;

            const gradient = ctx.createLinearGradient(centerX, centerY - pointerHeight, centerX, centerY + pointerHeight / 2);
            gradient.addColorStop(0, '#fbd38d');
            gradient.addColorStop(1, '#f6ad55');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - pointerHeight);
            ctx.lineTo(centerX - pointerWidth, centerY + pointerHeight * 0.7);
            ctx.lineTo(centerX + pointerWidth, centerY + pointerHeight * 0.7);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#f6ad55';
            ctx.beginPath();
            ctx.arc(centerX, centerY, Math.max(6 * renderScale, 4), 0, Math.PI * 2);
            ctx.fill();
        }

        function setupEventListeners() {
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseUp);

            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd);

            window.addEventListener('resize', () => {
                window.requestAnimationFrame(resizeCanvas);
            });
        }

        function handleMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            startDrag(x, y);
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            updateDrag(x, y);
        }

        function handleMouseUp() {
            endDrag();
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            startDrag(x, y);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            updateDrag(x, y);
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            endDrag();
        }

        function startDrag(x, y) {
            const distance = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);

            for (const [type, ring] of Object.entries(rings)) {
                if (Math.abs(distance - ring.radius) < ring.width / 2 + 10 * renderScale) {
                    isDragging = true;
                    dragRing = type;
                    lastAngle = Math.atan2(y - centerY, x - centerX) * 180 / Math.PI;
                    canvas.style.cursor = 'grabbing';
                    break;
                }
            }
        }

        function updateDrag(x, y) {
            if (!isDragging || !dragRing) return;

            const currentAngle = Math.atan2(y - centerY, x - centerX) * 180 / Math.PI;
            let deltaAngle = currentAngle - lastAngle;

            if (deltaAngle > 180) deltaAngle -= 360;
            if (deltaAngle < -180) deltaAngle += 360;

            rings[dragRing].angle = (rings[dragRing].angle + deltaAngle + 360) % 360;
            updateValueFromAngle(dragRing);

            lastAngle = currentAngle;
            drawSundial();
            updateDisplay();
        }

        function endDrag() {
            isDragging = false;
            dragRing = null;
            canvas.style.cursor = 'grab';
        }

        function updateValueFromAngle(ringType) {
            const ring = rings[ringType];
            const normalizedAngle = ring.angle / 360;

            if (ringType === 'day') {
                const maxDays = getDaysInMonth();
                ring.max = maxDays;
                ring.current = Math.round(normalizedAngle * (maxDays - 1)) + 1;
            } else {
                ring.current = Math.round(normalizedAngle * (ring.max - ring.min)) + ring.min;
            }

            ring.current = Math.max(ring.min, Math.min(ring.max, ring.current));

            if (ringType === 'year' || ringType === 'month') {
                const maxDays = getDaysInMonth();
                rings.day.max = maxDays;
                if (rings.day.current > maxDays) {
                    rings.day.current = maxDays;
                    rings.day.angle = ((rings.day.current - 1) / (maxDays - 1 || 1)) * 360;
                }
            }
        }

        function updateDisplay() {
            const dateStr = `${rings.year.current}年${rings.month.current}月${rings.day.current}日`;
            const timeStr = `${rings.hour.current.toString().padStart(2, '0')}:00`;

            document.getElementById('selectedDate').textContent = dateStr;
            document.getElementById('selectedTime').textContent = timeStr;
        }

        function confirmSelection() {
            const selectedTime = {
                year: rings.year.current,
                month: rings.month.current,
                day: rings.day.current,
                hour: rings.hour.current,
                timestamp: new Date(rings.year.current, rings.month.current - 1, rings.day.current, rings.hour.current).toISOString(),
                formatted: `${rings.year.current}年${rings.month.current}月${rings.day.current}日 ${rings.hour.current.toString().padStart(2, '0')}:00`
            };

            sessionStorage.setItem('selectedTime', JSON.stringify(selectedTime));
            sessionStorage.setItem('selectedLocation', JSON.stringify(DEFAULT_LOCATION));
            window.location.href = '/starmap';
        }

        function darkenColor(color, factor) {
            const hex = color.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);

            const newR = Math.floor(r * (1 - factor));
            const newG = Math.floor(g * (1 - factor));
            const newB = Math.floor(b * (1 - factor));

            return `rgb(${newR}, ${newG}, ${newB})`;
        }

        init();
    </script>
</body>

</html>
