<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位置选择器 - 中国时间</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        :root {
            --panel-padding: clamp(16px, 1.8vw, 28px);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0c0c1e 0%, #1a1a3e 50%, #2d2d5f 100%);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .page-shell {
            width: min(1200px, 100%);
            margin: 0 auto;
            padding: clamp(20px, 5vw, 48px) clamp(16px, 4vw, 56px) 72px;
            box-sizing: border-box;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(12px, 2vw, 20px);
            margin-bottom: clamp(20px, 4vw, 36px);
            flex-wrap: wrap;
        }

        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .step.completed {
            background: linear-gradient(45deg, #4ade80, #22c55e);
            color: white;
        }

        .step.active {
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            color: white;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .step.inactive {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
        }

        .step-line {
            width: clamp(32px, 12vw, 60px);
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .step-line.completed {
            background: linear-gradient(90deg, #4ade80, #22c55e);
        }

        #earthCanvas {
            border-radius: 50%;
            cursor: grab;
            transition: transform 0.3s ease;
            width: 100%;
            height: auto;
            position: relative;
            z-index: 1;
            display: block;
            max-width: 100%;
        }

        #earthCanvas:active {
            cursor: grabbing;
        }

        #earthCanvas:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        .city-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 8px 16px;
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .city-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }

        .city-btn.selected {
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            border-color: #3b82f6;
        }

        .coord-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin: 8px 0;
            border-left: 3px solid #3b82f6;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(16px, 3vw, 32px);
            align-items: stretch;
        }

        .panel {
            padding: var(--panel-padding);
            display: flex;
            flex-direction: column;
            gap: clamp(16px, 2vw, 24px);
        }

        .panel h2 {
            color: white;
            font-size: clamp(1.1rem, 2.2vw, 1.35rem);
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
        }

        .panel h2 i {
            color: #60a5fa;
        }

        .summary-block {
            background: rgba(17, 24, 39, 0.7);
            border-radius: 14px;
            padding: 16px;
            display: grid;
            gap: 8px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .earth-panel {
            align-items: center;
            text-align: center;
        }

        .earth-canvas-wrap {
            --outer-ring-inset: clamp(14px, 4vw, 26px);
            width: min(440px, 100%);
            margin: 0 auto;
            position: relative;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .earth-canvas-wrap::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(59, 130, 246, 0.35), rgba(59, 130, 246, 0) 62%);
            opacity: 0.85;
            pointer-events: none;
        }

        .earth-canvas-wrap::after {
            content: "";
            position: absolute;
            inset: var(--outer-ring-inset);
            border-radius: 50%;
            border: 2px solid rgba(148, 197, 255, 0.45);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
            pointer-events: none;
        }

        .earth-hint {
            color: #d1d5db;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .earth-hint span {
            display: block;
            color: rgba(209, 213, 219, 0.7);
            font-size: 0.78rem;
            margin-top: 4px;
        }

        .coord-group {
            display: grid;
            gap: 10px;
        }

        .actions {
            display: grid;
            gap: 12px;
            margin-top: auto;
        }

        .btn-primary {
            background: linear-gradient(45deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 1100px) {
            .layout-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .details-panel {
                grid-column: 1 / -1;
            }

            .earth-panel {
                order: -1;
            }
        }

        @media (max-width: 768px) {
            .page-shell {
                padding: clamp(20px, 5vw, 48px) clamp(16px, 6vw, 48px) 60px;
            }

            .layout-grid {
                grid-template-columns: 1fr;
            }

            .earth-panel {
                order: 0;
            }

            .summary-block {
                grid-template-columns: 1fr;
            }

            .coord-group {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .step-line {
                display: none;
            }
        }

        @media (max-width: 540px) {
            .coord-group {
                grid-template-columns: 1fr;
            }

            .quick-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <!-- 星空背景 -->
    <div class="stars" id="stars"></div>

    <div class="relative z-10 min-h-screen flex flex-col">
        <main class="page-shell">
            <!-- 步骤指示器 -->
            <div class="step-indicator">
                <div class="step completed">1</div>
                <div class="step-line completed"></div>
                <div class="step active">2</div>
                <div class="step-line inactive"></div>
                <div class="step inactive">3</div>
                <div class="step-line inactive"></div>
                <div class="step inactive">4</div>
            </div>

            <!-- 标题 -->
            <header class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white mb-2">选择观测位置</h1>
                <p class="text-gray-300">在地球上选择您的观测位置 | 滚轮缩放地球</p>
            </header>

            <!-- 主要内容区域 -->
            <div class="layout-grid">
                <!-- 左侧面板 -->
                <section class="glass-panel panel">
                    <h2><i class="fas fa-clock"></i> 已选择时间</h2>
                    <div class="summary-block">
                        <div class="text-white font-mono" id="selectedTime">加载中...</div>
                        <div class="text-gray-400 text-sm" id="timeDetails">等待数据加载</div>
                    </div>

                    <h2><i class="fas fa-map-marker-alt"></i> 快速选择</h2>
                    <div class="quick-grid">
                        <button class="city-btn" data-city="beijing">北京</button>
                        <button class="city-btn" data-city="shanghai">上海</button>
                        <button class="city-btn" data-city="guangzhou">广州</button>
                        <button class="city-btn" data-city="shenzhen">深圳</button>
                        <button class="city-btn" data-city="hongkong">香港</button>
                        <button class="city-btn" data-city="taipei">台北</button>
                        <button class="city-btn" data-city="newyork">纽约</button>
                        <button class="city-btn" data-city="london">伦敦</button>
                        <button class="city-btn" data-city="tokyo">东京</button>
                        <button class="city-btn" data-city="paris">巴黎</button>
                        <button class="city-btn" data-city="sydney">悉尼</button>
                        <button class="city-btn" data-city="singapore">新加坡</button>
                    </div>

                    <button class="btn-secondary" id="getCurrentLocation">
                        <i class="fas fa-location-arrow mr-2"></i>
                        获取当前位置
                    </button>
                </section>

                <!-- 中央地球 -->
                <section class="glass-panel panel earth-panel">
                    <h2><i class="fas fa-globe"></i> 地球选择器</h2>
                    <div class="earth-canvas-wrap">
                        <canvas id="earthCanvas" width="400" height="400"></canvas>
                    </div>
                    <p class="earth-hint">
                        点击并拖拽地球来旋转视角
                        <span>点击地球表面选择位置 · 支持双指缩放</span>
                    </p>
                </section>

                <!-- 右侧面板 -->
                <section class="glass-panel panel details-panel">
                    <h2><i class="fas fa-crosshairs"></i> 当前位置</h2>

                    <div class="coord-group">
                        <div class="coord-display">
                            <div class="text-gray-300 text-sm">经度 (Longitude)</div>
                            <div class="text-white font-mono text-lg" id="longitude">114.0579°E</div>
                        </div>

                        <div class="coord-display">
                            <div class="text-gray-300 text-sm">纬度 (Latitude)</div>
                            <div class="text-white font-mono text-lg" id="latitude">22.5431°N</div>
                        </div>

                        <div class="coord-display">
                            <div class="text-gray-300 text-sm">地点</div>
                            <div class="text-white" id="locationName">深圳</div>
                        </div>

                        <div class="coord-display">
                            <div class="text-gray-300 text-sm">缩放级别</div>
                            <div class="text-blue-400" id="zoomLevel">1.0x</div>
                        </div>

                        <div class="coord-display">
                            <div class="text-gray-300 text-sm">状态</div>
                            <div class="text-green-400" id="locationStatus">
                                <i class="fas fa-check-circle mr-1"></i>
                                位置已选择
                            </div>
                        </div>
                    </div>

                    <div class="actions">
                        <button class="btn-primary" id="confirmLocation">
                            <i class="fas fa-arrow-right mr-2"></i>
                            进入天球坐标
                        </button>
                        <button class="btn-secondary" id="goBackToTime">
                            <i class="fas fa-arrow-left mr-2"></i>
                            返回时间选择
                        </button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        // ===== 全局状态 =====
        let canvas, ctx;
        let canvasSize = 400;
        let earthRadius = 180;

        // 当前旋转角（x: 上下俯仰, y: 左右转动）
        let rotation = { x: 0, y: 0 };
        // 动画目标旋转角
        let targetRotation = { x: 0, y: 0 };
        let isAnimating = false;

        // 拖拽相关
        let isDragging = false;
        let lastMousePos = { x: 0, y: 0 };

        // 缩放相关
        let zoomLevel = 1;
        const minZoom = 0.5;
        const maxZoom = 4;

        // 尺寸自适应
        let resizeRaf = null;

        // 纹理
        let earthTexture = null;
        let isTextureLoaded = false;
        let textureDataCache = null;

        // 当前位置（默认深圳）
        let selectedLocation = {
            lat: 22.5431,
            lng: 114.0579,
            name: "深圳",
            country: "中国"
        };

        // 城市预设
        const cities = {
            beijing:   { lat: 39.9042,  lng: 116.4074,  name: "北京",   country: "中国" },
            shanghai:  { lat: 31.2304,  lng: 121.4737,  name: "上海",   country: "中国" },
            guangzhou: { lat: 23.1291,  lng: 113.2644,  name: "广州",   country: "中国" },
            shenzhen:  { lat: 22.5431,  lng: 114.0579,  name: "深圳",   country: "中国" },
            hongkong:  { lat: 22.3193,  lng: 114.1694,  name: "香港",   country: "中国香港" },
            taipei:    { lat: 25.0330,  lng: 121.5654,  name: "台北",   country: "中国台湾" },
            tokyo:     { lat: 35.6762,  lng: 139.6503,  name: "东京",   country: "日本" },
            london:    { lat: 51.5074,  lng: -0.1278,   name: "伦敦",   country: "英国" },
            paris:     { lat: 48.8566,  lng: 2.3522,    name: "巴黎",   country: "法国" },
            newyork:   { lat: 40.7128,  lng: -74.0060,  name: "纽约",   country: "美国" },
            sydney:    { lat: -33.8688, lng: 151.2093,  name: "悉尼",   country: "澳大利亚" },
            singapore: { lat: 1.3521,   lng: 103.8198,  name: "新加坡", country: "新加坡" },
        };

        // ===== 启动入口 =====
        window.addEventListener('DOMContentLoaded', init);

        function init() {
            createStars();
            initCanvas();
            loadEarthTexture();
            loadSelectedTime();
            updateLocationDisplay();
            bindEvents();
        }

        // ===== 星空背景 =====
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // ===== Canvas 初始化 + 自适应 =====
        function initCanvas() {
            canvas = document.getElementById('earthCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
        }

        function handleResize() {
            if (resizeRaf) cancelAnimationFrame(resizeRaf);
            resizeRaf = requestAnimationFrame(resizeCanvas);
        }

        function resizeCanvas() {
            if (!canvas || !ctx) return;

            // 可视区域约束
            const wrapper = document.querySelector('.earth-canvas-wrap');
            const wrapperWidth = wrapper ? wrapper.clientWidth : Math.min(window.innerWidth * 0.8, 420);
            const availableHeight = window.innerHeight * 0.55;
            const targetSize = Math.max(Math.min(wrapperWidth, availableHeight, 520), 220);

            const dpr = window.devicePixelRatio || 1;

            canvasSize = targetSize;
            canvas.style.width = `${targetSize}px`;
            canvas.style.height = `${targetSize}px`;
            canvas.width = targetSize * dpr;
            canvas.height = targetSize * dpr;

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            earthRadius = (targetSize / 2) * 0.78; // 球半径
            drawEarth();
            resizeRaf = null;
        }

        // ===== 时间回显（第一步页面存的 sessionStorage）=====
        function loadSelectedTime() {
            try {
                const timeData = JSON.parse(sessionStorage.getItem('selectedTime'));
                if (timeData) {
                    document.getElementById('selectedTime').textContent =
                        `${timeData.year}年${timeData.month}月${timeData.day}日 ${timeData.hour}:00`;
                    document.getElementById('timeDetails').textContent =
                        `时间戳: ${timeData.year}-${String(timeData.month).padStart(2, '0')}-${String(timeData.day).padStart(2, '0')}T${String(timeData.hour).padStart(2, '0')}:00:00Z`;
                } else {
                    document.getElementById('selectedTime').textContent = '未选择时间';
                    document.getElementById('timeDetails').textContent = '请先选择时间';
                }
            } catch (err) {
                console.error('加载时间数据失败:', err);
            }
        }

        // ===== UI 刷新(右侧信息栏) =====
        function updateLocationDisplay() {
            const lngText = selectedLocation.lng >= 0
                ? `${selectedLocation.lng.toFixed(4)}°E`
                : `${Math.abs(selectedLocation.lng).toFixed(4)}°W`;

            const latText = selectedLocation.lat >= 0
                ? `${selectedLocation.lat.toFixed(4)}°N`
                : `${Math.abs(selectedLocation.lat).toFixed(4)}°S`;

            document.getElementById('longitude').textContent = lngText;
            document.getElementById('latitude').textContent = latText;
            document.getElementById('locationName').textContent = selectedLocation.name;
            document.getElementById('zoomLevel').textContent = zoomLevel.toFixed(1) + 'x';
            document.getElementById('locationStatus').innerHTML =
                '<i class="fas fa-check-circle mr-1"></i>位置已选择';
        }

        // ===== 事件绑定 =====
        function bindEvents() {
            // 鼠标拖拽 / 点击 / 滚轮缩放
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseUp);
            canvas.addEventListener('click', handleCanvasClick);
            canvas.addEventListener('wheel', handleWheel, { passive: false });

            // 触摸（拖拽 + 双指缩放）
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd);

            // 地点按钮
            document.getElementById('getCurrentLocation').addEventListener('click', getCurrentLocation);
            document.getElementById('confirmLocation').addEventListener('click', confirmLocation);
            document.getElementById('goBackToTime').addEventListener('click', () => {
                window.location.href = '/';
            });

            // 左侧快速城市
            document.querySelectorAll('.city-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectCity(btn.dataset.city);
                });
            });

            // 窗口自适应
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', handleResize);
        }

        // ===== 地球纹理加载 =====
        function loadEarthTexture() {
            earthTexture = new Image();
            earthTexture.crossOrigin = 'anonymous';
            earthTexture.onload = () => {
                isTextureLoaded = true;
                drawEarth();
            };
            earthTexture.src = 'https://raw.githubusercontent.com/mingo-wu1/forpic_test/main/earth_atmos_2048_3.png';
        }

        // ===== 鼠标/触摸交互 =====
        function handleMouseDown(e) {
            isDragging = true;
            lastMousePos = { x: e.clientX, y: e.clientY };
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const currentPos = { x: e.clientX, y: e.clientY };
            const dx = currentPos.x - lastMousePos.x;
            const dy = currentPos.y - lastMousePos.y;

            rotation.y += dx * 0.01;
            rotation.x -= dy * 0.01;

            rotation.x = clamp(rotation.x, -Math.PI / 2, Math.PI / 2);

            lastMousePos = currentPos;
            drawEarth();
        }

        function handleMouseUp() {
            isDragging = false;
        }

        // 触摸缩放辅助
        let touchLastDist = null;

        function handleTouchStart(e) {
            if (e.touches.length === 1) {
                isDragging = true;
                lastMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                touchLastDist = getTouchDistance(e);
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();

            if (e.touches.length === 1 && isDragging) {
                const currentPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                const dx = currentPos.x - lastMousePos.x;
                const dy = currentPos.y - lastMousePos.y;

                rotation.y += dx * 0.01;
                rotation.x -= dy * 0.01;
                rotation.x = clamp(rotation.x, -Math.PI / 2, Math.PI / 2);

                lastMousePos = currentPos;
                drawEarth();
            } else if (e.touches.length === 2) {
                const newDist = getTouchDistance(e);
                if (touchLastDist !== null) {
                    const scaleChange = newDist / touchLastDist;
                    zoomLevel = clamp(zoomLevel * scaleChange, minZoom, maxZoom);
                    updateLocationDisplay();
                    drawEarth();
                }
                touchLastDist = newDist;
            }
        }

        function handleTouchEnd() {
            isDragging = false;
            touchLastDist = null;
        }

        function getTouchDistance(e) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function handleWheel(e) {
            e.preventDefault();
            const factor = e.deltaY > 0 ? 0.9 : 1.1;
            zoomLevel = clamp(zoomLevel * factor, minZoom, maxZoom);
            updateLocationDisplay();
            drawEarth();
        }

        // ===== 点击地球选择位置 =====
        function handleCanvasClick(e) {
            if (isDragging) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvasSize / rect.width;
            const scaleY = canvasSize / rect.height;

            const x = (e.clientX - rect.left) * scaleX - canvasSize / 2;
            const y = (e.clientY - rect.top) * scaleY - canvasSize / 2;

            const rNow = earthRadius * zoomLevel;
            const dist = Math.sqrt(x * x + y * y);
            if (dist > rNow) return; // 点在球外

            const coords = getLatLngFromClick(x, y);
            if (!coords) return;

            selectedLocation = {
                lat: coords.lat,
                lng: coords.lng,
                name: "自定义位置",
                country: "未知"
            };

            document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('selected'));

            updateLocationDisplay();
            drawEarth();
        }

        // ===== 城市选择并转过去 =====
        function selectCity(key) {
            const c = cities[key];
            if (!c) return;

            selectedLocation = { ...c };
            updateLocationDisplay();

            // 目标朝向
            targetRotation.y = -(c.lng * Math.PI / 180);
            targetRotation.x =  (c.lat * Math.PI / 180);
            targetRotation.x = clamp(targetRotation.x, -Math.PI / 2, Math.PI / 2);

            isAnimating = true;
            requestAnimationFrame(animateRotation);
        }

        function animateRotation() {
            if (!isAnimating) return;

            // 处理水平角度差，考虑跨越 -π / π
            let diffY = targetRotation.y - rotation.y;
            if (Math.abs(diffY) > Math.PI) {
                diffY = diffY > 0 ? diffY - 2 * Math.PI : diffY + 2 * Math.PI;
            }

            const diffX = targetRotation.x - rotation.x;

            rotation.y += diffY * 0.1;
            rotation.x += diffX * 0.1;
            rotation.x = clamp(rotation.x, -Math.PI / 2, Math.PI / 2);

            if (Math.abs(diffY) < 0.001 && Math.abs(diffX) < 0.001) {
                rotation.y = targetRotation.y;
                rotation.x = targetRotation.x;
                isAnimating = false;
            }

            drawEarth();
            if (isAnimating) requestAnimationFrame(animateRotation);
        }

        // ===== 地球绘制 =====
        function drawEarth() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvasSize, canvasSize);

            const centerX = canvasSize / 2;
            const centerY = canvasSize / 2;
            const rNow = earthRadius * zoomLevel;

            // 背景球体 / 纹理加载中
            if (!isTextureLoaded) {
                ctx.fillStyle = '#4682B4';
                ctx.beginPath();
                ctx.arc(centerX, centerY, rNow, 0, 2 * Math.PI);
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('加载地球纹理中...', centerX, centerY);
                return;
            }

            // 准备纹理缓存
            if (!textureDataCache) {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = earthTexture.width;
                tempCanvas.height = earthTexture.height;
                tempCtx.drawImage(earthTexture, 0, 0);
                textureDataCache = tempCtx.getImageData(0, 0, earthTexture.width, earthTexture.height);
            }

            // 在一个圆形裁剪区内画球面
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, rNow, 0, 2 * Math.PI);
            ctx.clip();

            const imgSize = Math.ceil(rNow * 2);
            const imageData = ctx.createImageData(imgSize, imgSize);
            const outData = imageData.data;

            const cosX = Math.cos(rotation.x);
            const sinX = Math.sin(rotation.x);
            const cosY = Math.cos(rotation.y);
            const sinY = Math.sin(rotation.y);

            const step = rNow > 200 ? (rNow > 300 ? 4 : 2) : 1;

            for (let py = 0; py < imgSize; py += step) {
                for (let px = 0; px < imgSize; px += step) {
                    const dx = px - rNow;
                    const dy = py - rNow;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > rNow) continue;

                    // 单位球坐标 (nx, ny, nz)
                    const nx = dx / rNow;
                    const ny = dy / rNow;
                    const nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));

                    // 旋转: 先绕Y, 再绕X，使得 rotation 影响贴图位置
                    const x1 = nx * cosY - nz * sinY;
                    const z1 = nx * sinY + nz * cosY;
                    const y1 = ny * cosX - z1 * sinX;
                    const z2 = ny * sinX + z1 * cosX;

                    // 计算经纬度
                    const lat = Math.asin(clamp(y1, -1, 1));
                    const lng = Math.atan2(x1, z2);

                    // 映射成纹理坐标
                    let tx = ((lng + Math.PI) / (2 * Math.PI)) * earthTexture.width;
                    let ty = ((Math.PI / 2 - lat) / Math.PI) * earthTexture.height;

                    tx = Math.floor(tx) % earthTexture.width;
                    if (tx < 0) tx += earthTexture.width;
                    ty = Math.floor(ty);
                    ty = clamp(ty, 0, earthTexture.height - 1);

                    const srcIdx = (ty * earthTexture.width + tx) * 4;
                    const r = textureDataCache.data[srcIdx + 0];
                    const g = textureDataCache.data[srcIdx + 1];
                    const b = textureDataCache.data[srcIdx + 2];

                    // 用同一颜色填 step×step 小块（降采样提速）
                    for (let oy = 0; oy < step; oy++) {
                        for (let ox = 0; ox < step; ox++) {
                            const drawX = px + ox;
                            const drawY = py + oy;
                            if (drawX >= imgSize || drawY >= imgSize) continue;

                            const outIdx = (drawY * imgSize + drawX) * 4;
                            outData[outIdx + 0] = r;
                            outData[outIdx + 1] = g;
                            outData[outIdx + 2] = b;
                            outData[outIdx + 3] = 255;
                        }
                    }
                }
            }

            ctx.putImageData(imageData, centerX - rNow, centerY - rNow);
            ctx.restore();

            // 画选中点
            const marker = projectPoint(selectedLocation.lat, selectedLocation.lng);
            if (marker.visible) {
                ctx.beginPath();
                ctx.fillStyle = 'rgba(255,80,80,0.9)';
                ctx.arc(marker.x, marker.y, 4, 0, 2 * Math.PI);
                ctx.fill();

                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255,80,80,0.6)';
                ctx.lineWidth = 2;
                ctx.arc(marker.x, marker.y, 8, 0, 2 * Math.PI);
                ctx.stroke();
            }
        }

        // ===== 地理点投影到屏幕坐标 =====
        function projectPoint(latDeg, lngDeg) {
            const lat = deg2rad(latDeg);
            const lng = deg2rad(lngDeg);

            // 球坐标
            let x = Math.cos(lat) * Math.sin(lng);
            let y = Math.sin(lat);
            let z = Math.cos(lat) * Math.cos(lng);

            // 应用当前旋转 (绕X,绕Y，和drawEarth里一致)
            const cosX = Math.cos(rotation.x);
            const sinX = Math.sin(rotation.x);
            const y1 = y * cosX - z * sinX;
            const z1 = y * sinX + z * cosX;

            const cosY = Math.cos(rotation.y);
            const sinY = Math.sin(rotation.y);
            const x2 = x * cosY + z1 * sinY;
            const z2 = -x * sinY + z1 * cosY;

            // 背面不显示
            if (z2 < 0) return { visible: false };

            const rNow = earthRadius * zoomLevel;
            return {
                visible: true,
                x: canvasSize / 2 + x2 * rNow,
                y: canvasSize / 2 - y1 * rNow
            };
        }

        // ===== 点击点 -> 经纬度（逆投影）=====
        function getLatLngFromClick(x, y) {
            const rNow = earthRadius * zoomLevel;
            const nx = x / rNow;
            const ny = y / rNow;
            const dist2 = nx * nx + ny * ny;
            if (dist2 > 1) return null;

            const nz = Math.sqrt(1 - dist2);

            // 把观察平面坐标逆旋到"地球坐标"
            const cosY = Math.cos(rotation.y);
            const sinY = Math.sin(rotation.y);
            const cosX = Math.cos(rotation.x);
            const sinX = Math.sin(rotation.x);

            // 逆 Y 轴旋转
            const rx = nx * cosY + nz * (-sinY);
            const rz = nx * sinY + nz * cosY;
            const ry = ny;

            // 逆 X 轴旋转
            const ry2 = ry * cosX + rz * sinX;
            const rz2 = -ry * sinX + rz * cosX;
            const rx2 = rx;

            const lat = Math.asin(clamp(ry2, -1, 1));
            const lng = Math.atan2(rx2, rz2);

            return {
                lat: rad2deg(lat),
                lng: rad2deg(lng)
            };
        }

        // ===== 浏览器定位 =====
        function getCurrentLocation() {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    selectedLocation = {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        name: "当前位置",
                        country: "未知"
                    };

                    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('selected'));

                    updateLocationDisplay();

                    targetRotation.y = -(selectedLocation.lng * Math.PI / 180);
                    targetRotation.x =  (selectedLocation.lat * Math.PI / 180);
                    targetRotation.x = clamp(targetRotation.x, -Math.PI / 2, Math.PI / 2);

                    isAnimating = true;
                    requestAnimationFrame(animateRotation);
                },
                (err) => {
                    console.error('获取位置失败:', err);
                    alert('无法获取当前位置，请检查位置权限设置');
                }
            );
        }

        // ===== 确认并进入下一步 =====
        function confirmLocation() {
            try {
                const timeData = JSON.parse(sessionStorage.getItem('selectedTime'));
                if (!timeData) {
                    alert('请先选择时间');
                    window.location.href = '/';
                    return;
                }

                const locationData = {
                    latitude: selectedLocation.lat,
                    longitude: selectedLocation.lng,
                    address: selectedLocation.name,
                    country: selectedLocation.country
                };
                sessionStorage.setItem('selectedLocation', JSON.stringify(locationData));
                window.location.href = '/sphere';
            } catch (err) {
                console.error('确认位置失败:', err);
                alert('位置保存失败');
            }
        }

        // ===== 小工具函数 =====
        function clamp(v, lo, hi) {
            return Math.max(lo, Math.min(hi, v));
        }

        function deg2rad(d) {
            return d * Math.PI / 180;
        }

        function rad2deg(r) {
            return r * 180 / Math.PI;
        }
    </script>
</body>
</html>
